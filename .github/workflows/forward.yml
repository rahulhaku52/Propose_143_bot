name: Telegram Auto Forwarder

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  forward-posts:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install requirements
        run: pip install -r requirements.txt

      # ✅ Try to download, but continue if not found
      - name: Download saved data (if exists)
        uses: actions/download-artifact@v4
        with:
          name: bot-data
          path: .
        continue-on-error: true    # ← First run error ignore

      - name: Run forwarder
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
        run: python forwarder.py

      - name: Upload saved data
        uses: actions/upload-artifact@v4
        with:
          name: bot-data
          path: |
            groups.json
            state.json
          retention-days: 90
