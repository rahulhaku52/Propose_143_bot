name: Telegram Auto Forwarder

on:
  # ⏰ Runs every 15 minutes automatically
  schedule:
    - cron: '*/15 * * * *'

  # 🖐️ Manual trigger button (for testing)
  workflow_dispatch:

jobs:
  forward-posts:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Get the code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Setup Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 3️⃣ Install dependencies
      - name: Install requirements
        run: pip install -r requirements.txt

      # 4️⃣ Download saved data (groups.json + state.json)
      - name: Download saved data
        uses: actions/download-artifact@v4
        with:
          name: bot-data
        continue-on-error: true   # First run may have no data yet

      # 5️⃣ Run the forwarder
      - name: Run forwarder.py
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
        run: python forwarder.py

      # 6️⃣ Save data for next run (groups.json + state.json)
      - name: Upload saved data
        uses: actions/upload-artifact@v4
        with:
          name: bot-data
          path: |
            groups.json
            state.json
          retention-days: 90
