name: Telegram Auto Forwarder

on:
  # ⏰ প্রতি ১৫ মিনিটে auto চালাবে
  schedule:
    - cron: '*/15 * * * *'

  # 🖐️ Manual test button
  workflow_dispatch:

jobs:
  forward-posts:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Code নামাও
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Python setup
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 3️⃣ Dependencies install
      - name: Install requirements
        run: pip install -r requirements.txt

      # 4️⃣ আগের data লোড করো (groups.json + state.json)
      - name: Download saved data
        uses: actions/download-artifact@v4
        with:
          name: bot-data
          path: .
        continue-on-error: true

      # 5️⃣ Forwarder চালাও
      - name: Run forwarder
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
        run: python forwarder.py

      # 6️⃣ Data save করো পরের run এর জন্য
      - name: Upload saved data
        uses: actions/upload-artifact@v4
        with:
          name: bot-data
          path: |
            groups.json
            state.json
          retention-days: 90
